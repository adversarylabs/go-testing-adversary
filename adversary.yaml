name: go/testing
version: 0.0.12
description: "Reviews Go tests for broken harnesses, flaky shared state, and selector oracles that preserve trivial boundary implementations."

triggers:
  manual: true
  files_changed:
    - "**/*_test.go"

detection:
  files:
    - "**/*_test.go"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
