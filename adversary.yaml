name: go/testing
version: 0.0.5
description: "Reviews Go tests for TestMain mistakes, fatal-in-goroutine, sleep sync, fixed ports, and env leakage."

triggers:
  manual: true
  files_changed:
    - "**/*_test.go"

detection:
  files:
    - "**/*_test.go"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
